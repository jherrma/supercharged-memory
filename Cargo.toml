[package]
name = "supercharged-memory"
version = "2.0.0"
edition = "2024"
rust-version = "1.98"
description = "Long-term memory for AI coding agents: a local vector database with recall, consolidation and backup"
repository = "https://github.com/jherrma/supercharged-memory"
license = "GPL-3.0-only"

[dependencies]
# Both already compile into the binary through turso (chrono) and ureq (flate2);
# naming them here adds no crate. chrono: the local date in a dump's file name.
# flate2: the dump is gzip, written and verified in-process.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
pollster = "1"
serde_json = "1"
turso = { version = "0.7.2", default-features = false }
# Already compiled in: the engine's own SQL parser, which turso_core depends on.
# `restore` splits a dump into statements with it, so its boundaries are
# exactly the ones the engine sees -- quotes, comments and trigger bodies included.
turso_parser = "0.7.2"
ureq = { version = "3", features = ["json"] }

# The end-to-end suite runs the binary and the Python reference side by side
# on throwaway machines. It brings its own runner: it has to check the real
# home before the first test and after the last one, and to print every
# comparison it could not run, which libtest would swallow.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false

# The benchmark's measuring launcher; never shipped. Built for the host with
# `cargo build --release --example bench-measure`, used by `bench/bench.py`.
[[example]]
name = "bench-measure"
path = "bench/measure.rs"

[profile.release]
# One self-contained binary is the whole point (see stories/17-go-rewrite).
# Strip symbols and optimise for size; a memory CLI is not throughput-bound.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
