[package]
name = "supercharged-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Long-term memory for AI coding agents: a local vector database with recall, consolidation and backup"
repository = "https://github.com/jherrma/supercharged-memory"
license = "MIT"

[dependencies]
# Both already compile into the binary through turso (chrono) and ureq (flate2);
# naming them here adds no crate. chrono: the local date in a dump's file name.
# flate2: the dump is gzip, written and verified in-process.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
pollster = "1"
serde_json = "1"
turso = { version = "0.7.2", default-features = false }
# Already compiled in: the engine's own SQL parser, which turso_core depends on.
# `restore` splits a dump into statements with it, so its boundaries are
# exactly the ones the engine sees -- quotes, comments and trigger bodies included.
turso_parser = "0.7.2"
ureq = { version = "3", features = ["json"] }

[profile.release]
# One self-contained binary is the whole point (see stories/17-go-rewrite).
# Strip symbols and optimise for size; a memory CLI is not throughput-bound.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
